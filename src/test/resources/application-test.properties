# Test environment must never access the real backup directory or metadata database.
backup.root=${java.io.tmpdir}/utm-backup-manager-test/backups
backup.metadata-db=${java.io.tmpdir}/utm-backup-manager-test/backup-manager.db
backup.legacy-state-file=${backup.root}/backup-state.tsv

# Keep the real provider configuration available for context startup.
# Tests must not perform destructive operations against real VMs.
vm.provider=test

spring.thymeleaf.cache=false
spring.messages.fallback-to-system-locale=false